[build-system]
requires = ["setuptools>=72.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pal"
version = "0.0.1"
authors = [
  { name="George Watson", email="gigolo@hotmail.co.uk" },
]
description = "Python Audio Library (raudio bindings)"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/takeiteasy/pal"
Issues = "https://github.com/takeiteasy/pal/issues"
